name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  darwin-arm64:
    name: darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      # mygo.json "main" is ./cmd/clash-go. The repository root has no Go files,
      # so a default `go list .` fails.
      - name: Build app, helper, zip, and disk image
        run: |
          go tool mygo build -platform darwin/arm64
          app="build/darwin-arm64/Clash Go.app"
          go build -o "$app/Contents/MacOS/clash-go-service" ./cmd/clash-go-service
          # Ad-hoc signature. "-" is the identity in mygo.json as well.
          codesign --force --sign - "$app/Contents/MacOS/clash-go-service"
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose=2 "$app"
          ver=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          want=$(jq -r .version mygo.json)
          test "$ver" = "$want"
          ditto -c -k --keepParent "$app" "build/darwin-arm64/Clash-Go-${ver}-arm64.zip"
          ls -lh build/darwin-arm64

      - name: Upload zip and dmg
        uses: actions/upload-artifact@v4
        with:
          name: clash-go-darwin-arm64
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          fi
          gh release upload "$tag" build/darwin-arm64/*.dmg build/darwin-arm64/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
