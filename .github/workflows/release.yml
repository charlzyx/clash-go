name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  darwin-arm64:
    name: darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"

      - name: Build app and disk image
        run: go tool mygo build -platform darwin/arm64

      - name: Show bundle metadata
        run: |
          app="build/darwin-arm64/Clash Go.app"
          plutil -p "$app/Contents/Info.plist"
          codesign --verify --verbose=2 "$app"
          codesign -dv "$app"
          ls -lh build/darwin-arm64

      - name: Upload app and dmg
        uses: actions/upload-artifact@v4
        with:
          name: clash-go-darwin-arm64
          path: |
            build/darwin-arm64/*.dmg
            build/darwin-arm64/*.app
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          fi
          gh release upload "$tag" build/darwin-arm64/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber
